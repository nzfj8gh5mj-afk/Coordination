<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype – Gestion des soins à domicile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#16202A; --muted:#55616C; --line:#DDE1DA; --line2:#EEF0EC;
  --accent:#2B78B8; --accent-ink:#FFFFFF; --accent-dark:#1F5F95; --side:#EAF3FB; --side-ink:#12324F; --side-active:#CFE3F5;
  --tint:#DCEBF8; --tint-ink:#1F5F95;
  --ok-bg:#E6F4EA; --ok:#1E6B34; --warn-bg:#FFF1D6; --warn:#7A4B00; --bad-bg:#FCE8E6; --bad:#9B1C1C;
  --conf-bg:#FFF8F1; --conf:#E8833A; --conf-ink:#8A3B00; --grey-bg:#EEF0EC; --grey:#44505B;
  --font:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#1A2129; --ink:#E8ECEF; --muted:#9AA6B1; --line:#2C3640; --line2:#232C35;
    --accent:#4A93D6; --accent-ink:#0B1520; --accent-dark:#7AB3E6; --side:#152230; --side-ink:#D6E7F7; --side-active:#20374D;
    --tint:#1D3346; --tint-ink:#9CC8EE;
    --ok-bg:#16301F; --ok:#7FD39A; --warn-bg:#3A2C10; --warn:#F2C46B; --bad-bg:#3A1A1A; --bad:#F2A3A3;
    --conf-bg:#2E2114; --conf:#E8833A; --conf-ink:#F5B47E; --grey-bg:#232C35; --grey:#B6C0C9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2129; --ink:#E8ECEF; --muted:#9AA6B1; --line:#2C3640; --line2:#232C35;
  --accent:#4A93D6; --accent-ink:#0B1520; --accent-dark:#7AB3E6; --side:#152230; --side-ink:#D6E7F7; --side-active:#20374D;
  --tint:#1D3346; --tint-ink:#9CC8EE;
  --ok-bg:#16301F; --ok:#7FD39A; --warn-bg:#3A2C10; --warn:#F2C46B; --bad-bg:#3A1A1A; --bad:#F2A3A3;
  --conf-bg:#2E2114; --conf:#E8833A; --conf-ink:#F5B47E; --grey-bg:#232C35; --grey:#B6C0C9; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-weight:700;font-size:18px;padding:0 10px 16px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px;min-height:44px}
.nav a[aria-current="page"]{background:var(--side-active);font-weight:600}
.badge{background:var(--conf);color:#16202A;font-weight:700;font-size:12px;border-radius:10px;padding:1px 8px}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-active);font-size:13px;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding:24px 28px 96px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.kicker{font-size:13px;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-size:26px;line-height:1.2}
h2{margin:0;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;min-height:44px;cursor:pointer}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--conf-bg);border-color:var(--conf);color:var(--conf-ink)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;max-width:100%;overflow-wrap:anywhere}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-info{background:var(--tint);color:var(--tint-ink)}.t-grey{background:var(--grey-bg);color:var(--grey)}
.banner{border-radius:10px;padding:12px 16px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner.conf{background:var(--conf-bg);border:1px solid var(--conf);color:var(--conf-ink)}
.banner.info{background:var(--tint);color:var(--tint-ink)}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid-plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(185px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.pcard .h{font-size:12px;color:var(--accent-dark);font-weight:700}
.pcard.conf{border:2px solid var(--conf);background:var(--conf-bg)}
.pcard.conf .h{color:var(--conf-ink)}
.pcard.susp{border-style:dashed;background:var(--bg);color:var(--muted)}
.pcard.done{border-color:var(--ok)}
.list .item{padding:13px 16px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:3px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.list .item[aria-current="true"]{background:var(--tint)}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>.a{flex:999 1 440px;min-width:0}
.split>.b{flex:1 1 360px;min-width:0}
dl.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0}
dl.kv dt{font-size:12px;color:var(--muted)}dl.kv dd{margin:2px 0 0;font-weight:500}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .v{font-size:30px;font-weight:700}
.bar{flex:1;background:var(--grey-bg);border-radius:6px;height:14px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.tr{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:5px}
.tr b.l{color:var(--accent-dark)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.dot{flex:none;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.dot.ok{background:var(--ok);color:#fff}.dot.no{background:var(--conf);color:#16202A}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--tint)}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,30,.45)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.visit{display:flex;flex-direction:column;gap:8px;padding:14px}
.visit.next{border:2px solid var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabbar{display:none}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .side{display:none}
  .main{padding:16px 14px 100px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .tabbar a{flex:1;text-align:center;font-size:11.5px;color:var(--muted);text-decoration:none;padding:8px 2px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
  .form{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr 1fr}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.pcard,.btn{transition:background .15s}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation principale">
    <div class="brand">[Nom de l'app]</div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <label class="f" style="font-size:12px">Connecté en tant que
        <select id="whoSel"></select>
      </label>
      <span id="syncState" class="muted" style="font-size:12px"></span>
    </div>
  </aside>
  <main class="main" id="main"><div class="empty">Chargement…</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
<dialog id="dlg"></dialog>
<div id="toastBox"></div>

<script>
(function(){
'use strict';
/* ---------- utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseIso = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const nowHM = () => { const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const JOURS_L = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const longDate = s => { const d=parseIso(s); return JOURS_L[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear(); };
const shortDate = s => { const d=parseIso(s); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); };
const uid = p => p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const toMin = h => { const [a,b]=(h||'00:00').split(':').map(Number); return a*60+b; };
const fromMin = m => pad2(Math.floor(m/60))+':'+pad2(m%60);
const tourneeOf = h => toMin(h) < 660 ? 'matin' : (toMin(h) < 840 ? 'midi' : 'soir');
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- données d'exemple (fictives) ---------- */
function demoState(){
  const t = today();
  return {
    v:1,
    nurses:[
      {id:'n1',nom:'Sophie M.',genre:'F',statut:'Infirmière salariée',competences:'Palliatif, diabète'},
      {id:'n2',nom:'Karim B.',genre:'M',statut:'Infirmier indépendant',competences:'Plaies, prises de sang'},
      {id:'n3',nom:'Julie V.',genre:'F',statut:'Infirmière indépendante',competences:'Palliatif'},
      {id:'n4',nom:'Nabil K.',genre:'M',statut:'Infirmier salarié',competences:'Diabète, stomies'}
    ],
    patients:[
      P('p1','Mme Claes M.','F',84,'Rue des Tilleuls 12, 1300 Wavre','Boîte à clés à gauche de la porte, 2e étage sans ascenseur','Fille (WhatsApp)',{genre:null,exclus:[],avant:null},['Soins palliatifs · nouveau protocole'],addDays(t,48),
        [plan('Confort, antalgie',[0,1,2,3,4,5,6],'08:45',40,'n1'),plan('Confort',[0,1,2,3,4,5,6],'18:00',20,'n2')]),
      P('p2','M. Dubois R.','M',71,'Avenue du Parc 4, 1340 Ottignies','Sonnette « Dubois », rez-de-chaussée','Épouse',{genre:null,exclus:[],avant:null},['Diabète insulinodépendant'],addDays(t,3),
        [plan('Insuline, glycémie',[0,1,2,3,4,5,6],'08:10',20,'n1'),plan('Insuline, glycémie',[0,1,2,3,4,5,6],'17:30',20,'n4')]),
      P('p3','Mme Laurent A.','F',88,'Rue Haute 51, 1330 Rixensart','Code porte 1452B','Fils',{genre:'F',exclus:[],avant:null},['Souhaite uniquement des soignantes'],addDays(t,80),
        [plan('Toilette complète, pilulier',[0,1,2,3,4,5,6],'07:30',30,'n1')]),
      P('p4','Mme Lambert S.','F',79,'Chaussée de Bruxelles 210, 1410 Waterloo','Clé chez la voisine du 1er','Belle-fille',{genre:null,exclus:['n2'],avant:'10:00'},['Aide familiale à 11 h'],addDays(t,6),
        [plan('Toilette, pilulier',[1,2,3,4,5,6],'09:30',30,'n3')]),
      P('p5','M. Janssens P.','M',82,'Rue du Moulin 8, 1300 Wavre','Porte de derrière','Fille',{genre:null,exclus:[],avant:null},[],addDays(t,70),
        [plan('Toilette, pilulier',[0,1,2,3,4,5,6],'08:20',30,'n2')],[{du:t,au:addDays(t,3),motif:'Hospitalisation'}]),
      P('p6','Mme Martin J.','F',67,'Rue de la Station 3, 1340 Ottignies','Appartement 2B','Aide familiale',{genre:null,exclus:[],avant:null},['À jeun pour les prises de sang'],addDays(t,20),
        [plan('Prise de sang',[2],'08:20',20,'n2')]),
      P('p7','M. Peeters L.','M',90,'Place communale 2, 1330 Rixensart','Sonner deux fois','Fils',{genre:null,exclus:[],avant:'10:45'},['Aide familiale à 11 h'],addDays(t,40),
        [plan('Toilette, bas de contention',[1,2,3,4,5,6],'10:50',30,'n3')]),
      P('p8','M. Renard T.','M',58,'Rue des Écoles 19, 7190 Écaussinnes','Rez, porte verte','Lui-même',{genre:null,exclus:[],avant:null},['Soin de plaie post-opératoire'],addDays(t,12),
        [plan('Soin de plaie',[2,5],'17:45',20,null)])
    ],
    demandes:[
      {id:'d1',type:'nouvelle',statut:'recue',patientNom:'Mme Simon D.',patientId:null,genre:'F',adresse:'Avenue Jean XXIII 17, 1330 Rixensart',soins:'Toilette, pilulier',jours:[1,2,4,5],debut:addDays(t,1),heure:'12:00',prefs:'',contact:'Fille',source:'Centre de coordination',creeLe:Date.now()-12*60000,historique:[{t:Date.now()-12*60000,txt:'Demande reçue du centre de coordination'}]},
      {id:'d2',type:'annulation',statut:'recue',patientId:'p4',date:addDays(t,1),motif:'Problème de salle de bain',source:'Famille',creeLe:Date.now()-65*60000,historique:[{t:Date.now()-65*60000,txt:'Demande reçue de la famille'}]},
      {id:'d3',type:'reprise',statut:'recue',patientId:'p5',date:addDays(t,4),motif:'Sortie d\u2019hôpital',source:'Centre de coordination',creeLe:Date.now()-120*60000,historique:[{t:Date.now()-120*60000,txt:'Demande reçue du centre de coordination'}]}
    ],
    visites:{}, overrides:{}, retards:[]
  };
  function plan(soins,jours,heure,duree,nurseId){ return {id:uid('pl'),soins,jours,heure,duree,nurseId,debut:addDays(t,-30),fin:null}; }
  function P(id,nom,genre,age,adresse,acces,contact,prefs,alertes,presc,plans,absences){
    return {id,nom,genre,age,adresse,acces,contact,prefs,alertes,prescriptionJusqu:presc,statut:'actif',plans,absences:absences||[],transmissions:[]};
  }
}

/* ---------- état et synchronisation ---------- */
let S = null;            // état courant
let db = null, docRef = null, mode = 'init', pending = null, lastRemote = '';
let downloads = null, sampler = null;
let who = 'coord';
let route = {view:'planning'};
let ui = {date: today(), tournee:'toutes', demandeSel:null, demandeFiltre:'atraiter', patientQ:'', trFiltre:'toutes'};
const LS_KEY = 'proto-soins-etat-v1';
const emptyState = () => ({v:1,nurses:[],patients:[],demandes:[],visites:{},overrides:{},retards:[]});

function lsGet(){ try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function lsSet(v){ try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch(e){} }

function save(){
  if (mode === 'db' && docRef){
    clearTimeout(pending);
    pending = setTimeout(async () => {
      const json = JSON.stringify(S); lastRemote = json;
      try { await docRef.set({json, at: Date.now()}); setSync('Synchronisé avec l\u2019équipe'); }
      catch(e){ setSync('Échec de la synchronisation : ' + (e && e.code || 'erreur')); }
    }, 350);
  } else { lsSet(S); }
}
function setSync(t){ const el=document.getElementById('syncState'); if(el) el.textContent=t; }
function commit(fn, msg){ fn(S); save(); render(); if (msg) toast(msg); }

async function initStore(){
  const local = lsGet();
  S = local || demoState(); mode = 'local';
  setSync('Mode local : données sur cet appareil');
  render();
  if (!window.claude || typeof window.claude.use !== 'function') return;
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  window.claude.use('sample').then(x => { sampler = x; }).catch(() => {});
  try {
    db = await window.claude.use('db');
  } catch(e){ db = null; }
  if (!db) return;
  docRef = db.doc('proto/etat');
  mode = 'db'; setSync('Connexion à l\u2019espace partagé…');
  docRef.onSnapshot(snap => {
    if (snap.exists){
      const d = snap.data(); if (!d || typeof d.json !== 'string') return;
      if (d.json === lastRemote && S) { setSync('Synchronisé avec l\u2019équipe'); return; }
      try { S = JSON.parse(d.json); lastRemote = d.json; setSync('Synchronisé avec l\u2019équipe'); render(); } catch(e){}
    } else {
      S = null; setSync('Espace partagé vide'); render();
    }
  }, err => { setSync('Synchronisation indisponible (' + (err && err.code || 'erreur') + ')'); });
}

/* ---------- calculs métier ---------- */
const nurse = id => S.nurses.find(n => n.id === id);
const patient = id => S.patients.find(p => p.id === id);
const absentOn = (p, date) => (p.absences||[]).find(a => date >= a.du && (!a.au || date <= a.au));

function passagesFor(date){
  const dow = parseIso(date).getDay(); const out = [];
  for (const p of S.patients){
    if (p.statut !== 'actif') continue;
    for (const pl of p.plans){
      if (!pl.jours.includes(dow)) continue;
      if (pl.debut && date < pl.debut) continue;
      if (pl.fin && date > pl.fin) continue;
      const key = date + '|' + pl.id; const ov = S.overrides[key] || {};
      const heure = ov.heure || pl.heure;
      out.push({key, date, p, pl, nurseId: ('nurseId' in ov) ? ov.nurseId : pl.nurseId, heure, duree: pl.duree || 30,
        tournee: tourneeOf(heure), suspendu: absentOn(p,date), annule: !!ov.annule, motifAnnul: ov.motif, visite: S.visites[key] || null});
    }
  }
  return out.sort((a,b) => toMin(a.heure) - toMin(b.heure));
}
function conflictsOf(list){
  const res = {};
  const add = (k, t) => (res[k] = res[k] || []).push(t);
  const active = list.filter(x => !x.suspendu && !x.annule);
  for (const x of active){
    const n = x.nurseId && nurse(x.nurseId);
    if (n){
      if ((x.p.prefs.exclus||[]).includes(n.id)) add(x.key, n.nom + ' est exclu(e) par le patient');
      if (x.p.prefs.genre === 'F' && n.genre === 'M') add(x.key, 'Le patient souhaite une soignante');
    }
    if (x.p.prefs.avant && toMin(x.heure) >= toMin(x.p.prefs.avant)) add(x.key, 'Prévu après ' + x.p.prefs.avant + ' (limite du patient)');
    if (x.p.prescriptionJusqu && x.date > x.p.prescriptionJusqu) add(x.key, 'Prescription expirée');
  }
  for (const n of S.nurses){
    const mine = active.filter(x => x.nurseId === n.id);
    for (let i=0;i<mine.length;i++) for (let j=i+1;j<mine.length;j++){
      const a=mine[i], b=mine[j];
      if (toMin(a.heure) < toMin(b.heure)+b.duree && toMin(b.heure) < toMin(a.heure)+a.duree){
        add(a.key, 'Chevauche ' + b.p.nom + ' (' + b.heure + ')'); add(b.key, 'Chevauche ' + a.p.nom + ' (' + a.heure + ')');
      }
    }
  }
  return res;
}

function pcard(x, conf){
  let cls = 'pcard', head = x.heure + ' – ' + fromMin(toMin(x.heure)+x.duree), extra = '';
  if (x.suspendu){ cls += ' susp'; head = 'Suspendu'; extra = '<span class="small">'+esc(x.suspendu.motif)+(x.suspendu.au?' · reprise le '+shortDate(addDays(x.suspendu.au,1)):'')+'</span>'; }
  else if (x.annule){ cls += ' susp'; head = 'Annulé · ' + x.heure; extra = '<span class="small">'+esc(x.motifAnnul||'')+'</span>'; }
  else if (conf){ cls += ' conf'; head = 'Conflit · ' + x.heure; extra = '<span class="small">'+esc(conf.join(' · '))+'</span>'; }
  else if (x.visite){ cls += ' done'; }
  const tags = (x.visite ? '<span class="tag '+(x.visite.statut==='fait'?'t-ok':'t-warn')+'">'+(x.visite.statut==='fait'?'Réalisé '+x.visite.heure:'Non réalisé')+'</span> ' : '') +
    (x.p.prefs.genre==='F' ? '<span class="tag t-info">Soignante uniquement</span> ' : '') + (x.p.alertes||[]).slice(0,1).map(a => '<span class="tag t-grey">'+esc(a)+'</span>').join('');
  return '<button class="'+cls+'" data-act="editPassage" data-k="'+esc(x.key)+'"><span class="h">'+esc(head)+'</span><strong>'+esc(x.p.nom)+'</strong><span class="small muted">'+esc(x.pl.soins)+'</span>'+extra+(tags?'<span class="row" style="gap:4px">'+tags+'</span>':'')+'</button>';
}

function suggestNurses(d){
  const dates = [0,1,2,3,4,5,6].map(i => addDays(d.debut,i)).filter(x => d.jours.includes(parseIso(x).getDay()));
  return S.nurses.filter(n => !(d.genre==='F' && /soignante/i.test(d.prefs||'') && n.genre==='M')).map(n => {
    let load = 0, clash = false;
    for (const dt of dates){ const l = passagesFor(dt).filter(x => x.nurseId===n.id && !x.suspendu && !x.annule); load += l.length;
      if (d.heure) clash = clash || l.some(x => toMin(x.heure) < toMin(d.heure)+30 && toMin(d.heure) < toMin(x.heure)+x.duree); }
    return {n, load, clash};
  }).sort((a,b) => (a.clash-b.clash) || (a.load-b.load));
}

function demandeAction(act, id){
  const d = S.demandes.find(x => x.id===id); if (!d) return;
  const h = txt => d.historique.push({t:Date.now(), txt: txt + ' (' + whoName() + ')'});
  if (act==='propose'){
    const nId = document.getElementById('pN').value, hr = document.getElementById('pH').value;
    commit(() => { d.proposition = {nurseId:nId, heure:hr}; d.statut='proposee'; h('Créneau proposé : '+(nurse(nId)||{}).nom+' à '+hr); }, 'Créneau proposé au partenaire');
  }
  if (act==='reopen') commit(() => { d.statut='recue'; h('Nouvelle proposition demandée'); });
  if (act==='confirm'){
    commit(s => {
      const p = {id:uid('p'),nom:d.patientNom,genre:d.genre||'F',age:null,adresse:d.adresse,acces:'',contact:d.contact,prefs:{genre:/soignante/i.test(d.prefs||'')?'F':null,exclus:[],avant:null},alertes:d.prefs?[d.prefs]:[],prescriptionJusqu:null,statut:'actif',
        plans:[{id:uid('pl'),soins:d.soins,jours:d.jours,heure:d.proposition.heure,duree:30,nurseId:d.proposition.nurseId,debut:d.debut,fin:null}],absences:[],transmissions:[]};
      s.patients.push(p); d.patientId = p.id; d.statut='planifiee'; h('Confirmée et planifiée');
    }, 'Patient créé et passages planifiés');
  }
  if (act==='apply'){
    commit(s => {
      const p = patient(d.patientId);
      if (d.type==='hospitalisation') p.absences.push({du:d.du, au:d.au||null, motif:'Hospitalisation'});
      if (d.type==='reprise'){ const a = p.absences.find(x => !x.au || x.au >= d.date); if (a) a.au = addDays(d.date,-1); }
      if (d.type==='annulation') for (const pl of p.plans) s.overrides[d.date+'|'+pl.id] = Object.assign({}, s.overrides[d.date+'|'+pl.id], {annule:true, motif:d.motif||'Annulation'});
      d.statut='planifiee'; h('Appliquée au planning');
    }, 'Planning mis à jour');
  }
  if (act==='refuse'){
    openDlg('Refuser la demande', '<label class="f">Motif<select id="rM"><option>Zone trop éloignée de nos tournées</option><option>Contrainte horaire impossible</option><option>Le patient a choisi une autre équipe</option><option>Autre</option></select></label>',
      [['Annuler',null],['Refuser la demande','ok',true]], a => { if (a==='ok'){ const m = document.getElementById('rM').value; commit(() => { d.statut='refusee'; d.motifRefus=m; h('Refusée : '+m); }, 'Demande refusée'); } });
  }
}

      const btn = document.querySelector('#dlg .dlg-f .primary'); btn.disabled = true; btn.textContent = 'Analyse en cours…';

        .catch(e => { document.getElementById('dlg').close(); dlgNewDemande({message:txt}); toast(e && e.code==='not_granted' ? 'Analyse refusée : complétez le formulaire' : 'Analyse impossible : complétez le formulaire'); });
      return false;

async function parseWhatsApp(txt){
  const pts = S.patients.map(p => ({id:p.id, nom:p.nom}));
  const prompt = 'Tu aides une coordinatrice de soins infirmiers à domicile en Belgique. Voici un message WhatsApp reçu d\u2019un partenaire. Extrais-en une demande structurée.\n' +
    'Date du jour : ' + today() + ' (' + longDate(today()) + '). Convertis les dates relatives (demain, lundi prochain, 12/10) en AAAA-MM-JJ.\n' +
    'Patients déjà suivis (id et nom) : ' + JSON.stringify(pts) + '\n' +
    'Types possibles : "nouvelle" (nouvelle prise en charge ou nouveaux soins), "hospitalisation" (patient hospitalisé, passages à suspendre), "reprise" (retour à domicile, reprise des passages), "annulation" (pas de passage un jour donné).\n' +
    'Réponds UNIQUEMENT avec un objet JSON, sans texte autour, avec ces clés (null si inconnu) :\n' +
    '{"type":string,"patientNom":string|null,"patientId":string|null (id d\u2019un patient déjà suivi si le message le concerne),"genre":"F"|"M"|null (Mme = F, M. = M),"adresse":string|null,"contact":string|null (personne et téléphone),"soins":string|null (ex. "Toilette, pilulier"),"jours":number[]|null (0=dimanche … 6=samedi; tous les jours = [0,1,2,3,4,5,6]),"debut":string|null,"heure":string|null (HH:MM),"prefs":string|null (préférences : soignante uniquement, avant 10 h…),"date":string|null (date de l\u2019annulation ou de la reprise),"du":string|null,"au":string|null (dates d\u2019hospitalisation),"motif":string|null,"source":"Centre de coordination"|"Famille"|"Patient"|"Hôpital"|"Médecin"|null}\n\nMessage :\n<<<\n' + txt + '\n>>>';
  const r = await sampler.json(prompt, {modelTier:'quick'});
  const pre = (r && typeof r === 'object') ? r : {};
  const out = {message: txt};
  ['type','patientNom','genre','adresse','contact','soins','debut','heure','prefs','date','du','au','motif','source'].forEach(k => { if (typeof pre[k] === 'string' && pre[k]) out[k] = pre[k]; });
  if (!['nouvelle','hospitalisation','reprise','annulation'].includes(out.type)) out.type = 'nouvelle';
  if (Array.isArray(pre.jours)) out.jours = pre.jours.map(Number).filter(n => n>=0 && n<=6);
  if (typeof pre.patientId === 'string' && patient(pre.patientId)) out.patientId = pre.patientId;
  else if (out.patientNom){ const key = out.patientNom.toLowerCase().replace(/^(mme|m|mr|madame|monsieur)\.?\s+/,'').split(' ')[0].replace(/\W/g,''); const m = key && S.patients.find(p => p.nom.toLowerCase().replace(/\W/g,'').includes(key)); if (m) out.patientId = m.id; }
  return out;
}

/* ---------- événements ---------- */
function bind(root){
  root.querySelectorAll('[data-act]').forEach(el => {
    const fire = () => {
      const a = el.dataset.act, v = el.dataset.v;
      if (a==='tournee'){ ui.tournee = v; render(); }
      else if (a==='day'){ ui.date = addDays(ui.date, Number(v)); render(); }
      else if (a==='today'){ ui.date = today(); render(); }
      else if (a==='editPassage') dlgEditPassage(el.dataset.k);
      else if (a==='dfilt'){ ui.demandeFiltre = v; ui.demandeSel = null; render(); }
      else if (a==='dsel'){ ui.demandeSel = v; render(); }
      else if (a==='newDemande') dlgNewDemande();
      else if (['propose','reopen','confirm','apply','refuse'].includes(a)) demandeAction(a, v);
      else if (a==='openPatient') location.hash = '#patient/'+v;
      else if (a==='trf'){ ui.trFiltre = v; render(); }
      else if (a==='newTr') dlgTransmission(v);
      else if (a==='closeTr'){ const [pid,tid] = v.split('|'); commit(() => { const x = patient(pid).transmissions.find(t=>t.id===tid); x.ouverte=false; }, 'Cible clôturée'); }
      else if (a==='editPatient') dlgEditPatient(v);
      else if (a==='absence') dlgAbsence(v);
      else if (a==='asNurse'){ who = v; render(); }
      else if (a==='validate') dlgValidate(v);
      else if (a==='notDone') dlgNotDone(v);
      else if (a==='late'){ const x = findPassage(v); commit(s => { s.retards = s.retards||[]; s.retards.push({date:today(),h:nowHM(),nurse:whoName(),patient:x.p.nom}); }, 'Retard signalé à la coordination'); }
      else if (a==='waPaste') dlgWhatsApp();
      else if (a==='newPatient') dlgNewPatient();
      else if (a==='plan'){ const [pid,plid] = v.split('|'); dlgPlan(pid, plid||null); }
      else if (a==='togglePatient') commit(() => { const p = patient(v); p.statut = p.statut==='arrete' ? 'actif' : 'arrete'; }, 'Statut du patient mis à jour');
      else if (a==='deletePatient'){ const p = patient(v); openDlg('Supprimer '+p.nom, '<p style="margin:0">Le patient, ses soins et ses transmissions seront supprimés définitivement.</p>', [['Annuler',null],['Supprimer','ok',true]], r => { if (r==='ok'){ commit(s => { s.patients = s.patients.filter(x => x.id!==v); }, 'Patient supprimé'); location.hash = '#patients'; } }); }
      else if (a==='nurse') dlgNurse(v||null);
      else if (a==='backup') offerFile('coordination-sauvegarde-'+today()+'.json', JSON.stringify(S, null, 1));
      else if (a==='csvPlanning') csvPlanning();
      else if (a==='csvPatients') csvPatients();
      else if (a==='wipe'){ openDlg('Vider toutes les données', '<p style="margin:0">Toutes les données seront effacées pour repartir de zéro. Pensez à télécharger une sauvegarde avant.</p>', [['Annuler',null],['Tout effacer','ok',true]], r => { if (r==='ok'){ S = emptyState(); save(); location.hash = '#equipe'; render(); toast('Données effacées'); } }); }
      else if (a==='reset'){ openDlg('Réinitialiser les données', '<p style="margin:0">Toutes les modifications seront remplacées par les données d\u2019exemple, pour toute l\u2019équipe.</p>', [['Annuler',null],['Réinitialiser','ok',true]], r => { if (r==='ok'){ S = demoState(); save(); render(); toast('Données d\u2019exemple rechargées'); } }); }
    };
    el.addEventListener('click', fire);
    if (el.tagName==='TR') el.addEventListener('keydown', e => { if (e.key==='Enter') fire(); });
  });
  const ri = root.querySelector('#restoreIn'); if (ri) ri.onchange = () => { const f = ri.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { let data; try { data = JSON.parse(rd.result); } catch(e){ toast('Fichier illisible'); return; }
      if (!data || !Array.isArray(data.nurses) || !Array.isArray(data.patients)){ toast('Ce fichier n\u2019est pas une sauvegarde valide'); return; }
      openDlg('Restaurer la sauvegarde', '<p style="margin:0">Les données actuelles seront remplacées par celles du fichier ('+data.patients.length+' patients, '+data.nurses.length+' soignants).</p>', [['Annuler',null],['Restaurer','ok',true]], r => { if (r==='ok'){ S = Object.assign(emptyState(), data); save(); render(); toast('Sauvegarde restaurée'); } }); };
    rd.readAsText(f); };
  const di = root.querySelector('#dateIn'); if (di) di.onchange = () => { if (di.value){ ui.date = di.value; render(); } };
  const pq = root.querySelector('#pQ'); if (pq) pq.oninput = () => { ui.patientQ = pq.value; const pos = pq.selectionStart; render(); const n = document.getElementById('pQ'); n.focus(); n.setSelectionRange(pos,pos); };
}
document.getElementById('whoSel').addEventListener('change', e => { who = e.target.value; if (who!=='coord' && route.view==='planning') location.hash = '#tournee'; else render(); });
function onHash(){
  const h = location.hash.slice(1) || 'planning';
  if (h.startsWith('patient/')) route = {view:'patient', id:h.split('/')[1]};
  else route = {view: VIEWS.some(v=>v[0]===h) ? h : 'planning'};
  ui.trFiltre = 'toutes';
  if (S) render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', onHash);
onHash();
initStore();
})();
</script>
</body>
</html>
